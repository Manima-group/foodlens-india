# Builds upon detekt's default config; only deviations are listed here.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable', 'Test', 'ParameterizedTest']
complexity:
  # Compose UI functions are declarative layout trees; length/branching is reviewed, not counted.
  LongMethod:
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
    ignoreSimpleWhenEntries: true
  TooManyFunctions:
    ignorePrivate: true
  LongParameterList:
    ignoreAnnotated: ['Composable']
    # Hilt-injected constructors list their collaborators explicitly.
    constructorThreshold: 10
style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    excludes: ['**/test/**', '**/androidTest/**']
  # ktlint (max_line_length = 120 in .editorconfig) owns line length; detekt's copy double-reports.
  MaxLineLength:
    active: false
  # Early-return guard clauses (cancellation/offline/304/each upload step) read better than nesting.
  ReturnCount:
    active: false
